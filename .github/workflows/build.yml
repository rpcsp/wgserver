---
name: Build and release wgserver

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wgserver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml version ($VERSION)"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Install WireGuard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools

      - name: Run tests
        run: cargo test --all-features --locked

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            cross: false

          - name: raspberry-pi-armv7
            target: armv7-unknown-linux-gnueabihf
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Configure ARM linker
        if: matrix.cross
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          EOF

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Ensure binary is executable
        run: chmod +x target/${{ matrix.target }}/release/wgserver

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wgserver-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/wgserver
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download x64 binary
        uses: actions/download-artifact@v4
        with:
          name: wgserver-linux-x64
          path: dist/x64

      - name: Download Raspberry Pi binary
        uses: actions/download-artifact@v4
        with:
          name: wgserver-raspberry-pi-armv7
          path: dist/armv7

      - name: Prepare release files
        run: |
          mv dist/x64/wgserver dist/wgserver-linux-x64
          mv dist/armv7/wgserver dist/wgserver-raspberry-pi-armv7
          cd dist
          sha256sum wgserver-linux-x64 wgserver-raspberry-pi-armv7 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wgserver-linux-x64
            dist/wgserver-raspberry-pi-armv7
            dist/SHA256SUMS
